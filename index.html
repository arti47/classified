<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- user-scalable=no and maximum-scale=1 are what stop an installed home-screen copy from
     pinching and double-tapping to zoom. Text still scales with the system font-size
     setting, which -webkit-text-size-adjust and relative units preserve. -->
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Classified">
<meta name="theme-color" content="#e9dfc7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f141c" media="(prefers-color-scheme: dark)">
<meta name="description" content="Player companion for the Classified role-playing game of covert operations.">
<title>Classified Player</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="preload" href="fonts/special-elite-400.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/plex-sans-400.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<a class="skip-link" href="#screen">Skip to content</a>

<header class="app-header" id="appHeader">
  <div class="header-bar">
    <div class="header-brand">
      <span class="header-title" id="headerTitle">Classified</span>
    </div>
    <div class="header-actions">
      <button type="button" class="agent-badge" id="agentBadge" hidden></button>
      <button type="button" class="icon-btn" id="helpBtn" aria-label="How this screen works" title="How this screen works"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3.5a8.5 8.5 0 1 0 0 17 8.5 8.5 0 0 0 0-17zM9.6 9.5a2.5 2.5 0 1 1 3.4 2.3c-.6.3-1 .8-1 1.5v.7M12 16.6h.01"/></svg></button>
      <button type="button" class="icon-btn" id="diceBtn" aria-label="Open the dice roller" title="Roller"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="3.5"/><circle cx="8.5" cy="8.5" r="1.2" fill="currentColor"/><circle cx="15.5" cy="8.5" r="1.2" fill="currentColor"/><circle cx="12" cy="12" r="1.2" fill="currentColor"/><circle cx="8.5" cy="15.5" r="1.2" fill="currentColor"/><circle cx="15.5" cy="15.5" r="1.2" fill="currentColor"/></svg></button>
    </div>
  </div>
  <div class="resource-header" id="resourceHeader" hidden></div>
</header>

<nav class="sub-nav" id="subNav" aria-label="Section" hidden></nav>

<main id="screen" class="screen" tabindex="-1"></main>

<nav class="bottom-nav" id="bottomNav" aria-label="Main"></nav>

<div id="modalRoot"></div>
<div id="toastRoot" class="toast-root" aria-live="polite" aria-atomic="true"></div>
<div id="liveRegion" class="sr-only" aria-live="polite" aria-atomic="true"></div>

<script type="module" src="src/main.js"></script>
</body>
</html>
