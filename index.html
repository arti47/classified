<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- user-scalable=no and maximum-scale=1 are what stop an installed home-screen copy from
     pinching and double-tapping to zoom. Text still scales with the system font-size
     setting, which -webkit-text-size-adjust and relative units preserve. -->
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Classified">
<meta name="theme-color" content="#8c1c13">
<meta name="description" content="Player companion for the Classified role-playing game of covert operations.">
<title>Classified Player</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<a class="skip-link" href="#screen">Skip to content</a>

<header class="app-header" id="appHeader">
  <div class="header-bar">
    <div class="header-brand">
      <span class="stamp" aria-hidden="true">CLASSIFIED</span>
      <span class="header-title" id="headerTitle">Dossier</span>
    </div>
    <div class="header-actions">
      <button type="button" class="icon-btn" id="themeBtn" aria-label="Toggle colour theme" title="Toggle theme">◐</button>
      <button type="button" class="icon-btn" id="diceBtn" aria-label="Open the dice roller" title="Roller">⚄</button>
    </div>
  </div>
  <div class="resource-header" id="resourceHeader" hidden></div>
</header>

<main id="screen" class="screen" tabindex="-1"></main>

<nav class="bottom-nav" id="bottomNav" aria-label="Main"></nav>

<div id="modalRoot"></div>
<div id="toastRoot" class="toast-root" aria-live="polite" aria-atomic="true"></div>
<div id="liveRegion" class="sr-only" aria-live="polite" aria-atomic="true"></div>

<script type="module" src="src/main.js"></script>
</body>
</html>
